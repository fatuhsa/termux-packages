name: Build Termux bootstraps

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Cache termux build state
        uses: actions/cache@v4
        with:
          path: |
            .termux-build-cache
            .data-data-cache
          # Static key: keeps the incremental build state between runs.
          # Bump the version to force a fresh full rebuild.
          key: termux-bootstrap-cache-v1
      - name: Prepare cache directories
        run: |
          mkdir -p .termux-build-cache .data-data-cache
          ls -ld .termux-build-cache .data-data-cache
      - name: Build bootstrap (aarch64)
        env:
          TERMUX_DOCKER_NO_APPARMOR: "1"
          TERMUX_DOCKER_RUN_EXTRA_ARGS: "--volume ${{ github.workspace }}/.termux-build-cache:/home/builder/.termux-build --volume ${{ github.workspace }}/.data-data-cache:/data/data"
        run: |
          scripts/free-space.sh
          scripts/run-docker.sh sudo ln -sf "/data/data/io.sanix/aosp" /system || true
          scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 --no-clean &> build.log || echo "== run-docker.sh exited $?, checking result =="
          test -f bootstrap-aarch64.zip || { echo "== NO ZIP PRODUCED, tail of build.log =="; tail -100 build.log; exit 1; }
      - name: Verify ELF interpreter
        run: |
          echo "== build.log tail =="
          tail -30 build.log
          mkdir -p verify && cd verify && unzip -q ../bootstrap-aarch64.zip
          echo "== login PT_INTERP =="
          readelf -l data/data/io.sanix/files/usr/bin/login | grep -A1 INTERP
          echo "== ld-linux-aarch64.so.1 exists =="
          ls -l data/data/io.sanix/files/usr/lib/ld-linux-aarch64.so.1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Termux bootstraps (aarch64)
          path: |
            ./bootstrap-aarch64.zip
